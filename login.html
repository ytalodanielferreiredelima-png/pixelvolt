<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXELVOLT | Login</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header id="topo-pagina">
    <nav class="navbar navbar-expand-lg navbar-dark" id="navbar-principal">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html"><img src="img/logo.svg" alt="PIXELVOLT"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html#section-banners">Promoções</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#section-novidades">Consoles</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#section-galeria">Jogos</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="login.html">Login</a></li>
          </ul>
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="O que deseja buscar?" aria-label="Search">
            <button class="btn btn-outline-info" type="submit">Buscar</button>
          </form>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section id="section-login" class="container">
      <h1>Login</h1>
      <div class="col-md-4 offset-md-4">

        <label for="usuario" class="form-label">Nome:</label>
        <input type="text" name="usuario" id="usuario" class="form-control" placeholder="Insira o seu usuário">

        <label for="senha" class="form-label">Senha:</label>
        <div class="campo-senha">
          <input type="password" id="senha" class="form-control" placeholder="Insira a sua senha">
          <button type="button" class="toggle-senha" id="toggle-senha" aria-label="Mostrar senha">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="dica-login">Dica para teste: usuário <strong>admin</strong>, senha <strong>123456</strong></p>

        <input type="button" value="login" class="btn btn-primary" id="bt-login" onclick="login()" />

        <div id="botao-cadastrar">
          <button type="button" class="btn btn-info">Não é cadastrado ainda? Cadastre-se</button>
        </div>
      </div>
    </section>

    <section id="section-cadastro">
      <div id="form-cadastrar" class="col-md-4 offset-md-4">
        <h2>Criar minha conta</h2>
        <p class="subtitulo-cadastro">Informe os seus dados abaixo para criar sua conta.</p>

        <label for="usuario-cad" class="form-label">Usuário:</label>
        <input type="text" id="usuario-cad" class="form-control" placeholder="ex. nome de usuário">

        <label for="email-cad" class="form-label">E-mail:</label>
        <input type="email" id="email-cad" class="form-control" placeholder="seu@email.com.br">

        <label for="senha-cad" class="form-label">Senha:</label>
        <input type="password" id="senha-cad" class="form-control" placeholder="mínimo de 6 caracteres">

        <input type="button" value="Cadastrar" class="btn btn-primary" id="bt-cadastrar" onclick="cadastro()" />
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-grid footer-grid-login">
      <div class="footer-marca">
        <img src="img/logo.svg" alt="PIXELVOLT" height="34">
        <p>Tudo para o seu setup, do primeiro controle à arena de e-sports.</p>
      </div>
    </div>
    <p class="footer-copy">Desenvolvido por PIXELVOLT</p>
    <button id="voltar-topo" type="button" class="btn btn-outline-primary" onclick="topo()">&uarr; Voltar ao topo</button>
  </footer>

  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.6.1.js"
    integrity="sha256-3zlB5s2uwoUzrXK3BT7AX3FyvojsraNFxCc2vC/7pNI=" crossorigin="anonymous"></script>
  <script src="js/jquery-script.js"></script>
</body>
</html>
